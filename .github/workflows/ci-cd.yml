name: VAMC CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  test:
    name: Test Suite & Coverage (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-subtests
          pip install .

      - name: Run Automated Test Suite with Coverage
        run: |
          mkdir -p docs/reports
          pytest -v --cov=src --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:docs/reports/coverage.xml \
            --cov-report=html:docs/reports/coverage \
            --junitxml=docs/reports/junit_unit_tests.xml

      - name: Run NFR Latency Benchmark (VAMC-NF-001)
        run: |
          python -m unittest tests/test_e2e_latency.py

      - name: Generate & Publish CI/CD Step Summary
        if: always()
        run: |
          python3 scripts/generate_ci_summary.py docs/reports/junit_unit_tests.xml docs/reports/coverage.xml

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports-py${{ matrix.python-version }}
          path: docs/reports/
          retention-days: 14

  build:
    name: Build & Package Artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vamc-dist
          path: dist/
          retention-days: 14

      - name: Publish CI Release Summary
        run: |
          echo "### 📦 VAMC Release Distribution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Package artifacts built successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: Wheel and source distribution ready in `dist/`." >> $GITHUB_STEP_SUMMARY
