name: "6. Code & Branch Coverage Quality Gate (>=80%)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage-quality-gate:
    name: "Full Coverage & Quality Gate Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-subtests
          pip install .

      - name: Execute Full Suite & Generate Reports
        run: |
          mkdir -p docs/reports
          pytest -v --cov=src --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:docs/reports/coverage.xml \
            --cov-report=html:docs/reports/coverage \
            --junitxml=docs/reports/junit_unit_tests.xml

      - name: Run Pipeline Quality Gate Verification Tests
        run: |
          pytest -v tests/test_sprint3_pipeline.py

      - name: Publish Step Summary
        if: always()
        run: |
          python3 scripts/generate_ci_summary.py docs/reports/junit_unit_tests.xml docs/reports/coverage.xml

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: docs/reports/
          retention-days: 14
