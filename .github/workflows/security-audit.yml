name: Security & Privacy Quality Gate Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security & Privacy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run Security & Privacy Audit Suite
        run: |
          python -m unittest tests/test_security_audit.py

      - name: Publish Security Audit Summary
        run: |
          echo "### 🔒 Security & Privacy Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Credential Isolation**: Verified zero committed plaintext tokens or secrets." >> $GITHUB_STEP_SUMMARY
          echo "- **Volatile RAM Zeroization**: Verified audio byte buffers zeroed out post-processing." >> $GITHUB_STEP_SUMMARY
          echo "- **Differential Privacy Defense**: Verified rejection of adversarial NaN/Inf gradient weights." >> $GITHUB_STEP_SUMMARY
